name: Windows portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native x64 binary and run offline self-tests
        shell: pwsh
        run: ./scripts/build.ps1 -Toolchain MSVC
      - name: Create portable package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify fresh extraction
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath build/fresh-extract
          $test = Start-Process -FilePath "$PWD/build/fresh-extract/G75Battery.exe" -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Extracted self-test failed: $($test.ExitCode)" }
          if (-not (Test-Path -LiteralPath build/fresh-extract/使用说明.txt)) { throw 'Missing usage instructions' }
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: dist/*
          if-no-files-found: error
